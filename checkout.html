<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout – IndexedDB Basket</title>
    <link rel="stylesheet" href="checkoutStyle.css">

    <!-- 2. LINK YOUR JAVASCRIPT FILE HERE (Option A: Recommended) -->
    <script src="CheckoutLogic.js" defer></script>

</head>
<body>
    <h1>Checkout</h1>
    <p>Review your basket items stored in IndexedDB</p>
    <button>⬅ Back to Shop</button>

    <h2>🧺 Basket Summary</h2>
    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <div>Loading basket...</div>

    <div>
        <strong>Total Amount:</strong>
        <span>$0.00</span>
    </div>

    <div>
        <button>🗑 Clear Basket</button>
        <button>✅ Confirm Order</button>
    </div>

    <hr>
    <div>
        <span>●</span>
        <span>Opening database...</span>
    </div>
    <div>Basket stored in IndexedDB → cart</div>
</body>
</html>
